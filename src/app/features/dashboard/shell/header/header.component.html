<header class="dash-header">
  <!-- ── Esquerda: hamburguer (mobile) ─────────────────── -->
  @if (isMobile()) {
    <button mat-icon-button class="btn-menu" (click)="abrirMenu.emit()" aria-label="Abrir menu">
      <mat-icon>menu</mat-icon>
    </button>
  }

  <!-- ── Direita: ícones de ação ────────────────────────── -->
  <div class="header-actions">
    <div class="pending-card" routerLink="/dashboard/agenda"
         [class.has-pending]="pendentesCount() > 0"
         [matTooltip]="pendentesCount() > 0 ? pendentesCount() + ' pendentes' : 'Sem pendentes'">
      <span class="pending-label">Pendentes</span>
      <span class="pending-count">{{ pendentesCount() }}</span>
    </div>

    <button mat-icon-button class="avatar-btn" [matMenuTriggerFor]="menuPerfil"
            aria-label="Menu da conta">
      @if (user()?.foto_url) {
        <img [src]="user()!.foto_url" [alt]="user()!.nome" class="avatar-img">
      } @else {
        <div class="avatar-fallback">{{ iniciais() }}</div>
      }
    </button>

    <mat-menu #menuPerfil="matMenu" xPosition="before" class="menu-perfil">
      <!-- Cabeçalho clicável → vai pra aba Perfil -->
      <button mat-menu-item routerLink="/dashboard/configuracoes"
              [queryParams]="{ aba: 'perfil' }" class="menu-header-btn">
        @if (user()?.foto_url) {
          <img [src]="user()!.foto_url" [alt]="user()!.nome" class="menu-avatar">
        } @else {
          <div class="menu-avatar fallback">{{ iniciais() }}</div>
        }
        <div class="menu-user-info">
          <div class="menu-nome">{{ user()?.nome }}</div>
          <div class="menu-plano">Plano {{ user()?.plano }}</div>
        </div>
      </button>
      <mat-divider />
      <button mat-menu-item routerLink="/dashboard/configuracoes">
        <mat-icon>settings</mat-icon>
        <span>Configurações da conta</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</header>
