<!-- ── Mobile: drawer lateral ─────────────────────── -->
@if (isMobile()) {
  <mat-sidenav-container class="dash-shell mobile" autosize>
    <mat-sidenav
      mode="over"
      position="start"
      class="mobile-drawer"
      [opened]="sidenavService.opened()"
      (openedChange)="onDrawerToggle($event)">
      <app-sidenav (itemClicked)="fecharDrawer()" />
    </mat-sidenav>

    <mat-sidenav-content>
      <app-dashboard-header />
      <main class="dash-content">
        <router-outlet />
      </main>
      <app-bottom-nav />
    </mat-sidenav-content>
  </mat-sidenav-container>
}

<!-- ── Desktop: sidenav fixa ─────────────────────────── -->
@if (!isMobile()) {
  <div class="dash-shell">
    <app-sidenav />
    <div class="dash-main">
      <app-dashboard-header />
      <main class="dash-content">
        <router-outlet />
      </main>
    </div>
  </div>
}
