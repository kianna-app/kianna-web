<section class="features-section">
  <div class="features-inner">
    <div class="section-header">
      <h2 class="section-titulo">Tudo que você precisa para focar no seu trabalho</h2>
      <p class="section-sub">Uma plataforma completa de agendamento, feita sob medida para o profissional autônomo brasileiro.</p>
    </div>

    <div class="features-grid">
      @for (f of features; track f.titulo) {
        <div class="feature-card">
          <div class="feature-icon">
            <mat-icon>{{ f.icone }}</mat-icon>
          </div>
          <h3 class="feature-titulo">{{ f.titulo }}</h3>
          <p class="feature-desc">{{ f.descricao }}</p>
        </div>
      }
    </div>
  </div>
</section>
